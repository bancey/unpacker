name: Build and Test

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unrar-free unzip p7zip-full tar
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Lint with Python
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Test imports and basic functionality
      run: |
        python -c "from config import Config; c = Config(); print(f'Config loaded: {c.host}:{c.port}')"
        python -c "from unpacker import Unpacker; u = Unpacker(); print(f'Unpacker loaded, tools: 7z={u.has_7z}, tar={u.has_tar}')"
        python -c "import app; print('Flask app imports successfully')"
        
    - name: Test archive detection and extraction logic
      run: |
        python -c "
        from unpacker import Unpacker
        import tempfile
        import os
        
        u = Unpacker()
        
        # Test archive detection
        assert u.is_archive('test.zip')
        assert u.is_archive('test.rar')
        assert not u.is_archive('test.txt')
        
        # Test path validation
        test_dir = tempfile.mkdtemp()
        result = u._extract_archive('/nonexistent/file.zip', test_dir)
        assert result[0] == False
        assert 'not found' in result[1]
        
        print('All tests passed!')
        "

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: unpacker:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test Docker image
      run: |
        docker run --rm unpacker:test python -c "from unpacker import Unpacker; print('Docker image works!')"
