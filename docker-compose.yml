version: '3.8'

services:
  unpacker:
    build: .
    container_name: sabnzbd-unpacker
    ports:
      - "5000:5000"
    volumes:
      # Mount your SABnzbd complete directory
      - /path/to/sabnzbd/complete:/downloads:rw
      # Persistent configuration
      - ./config:/config
    environment:
      # Optional: Override default host/port
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
